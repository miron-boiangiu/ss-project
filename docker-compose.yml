services:
  # Go API Service
  go-api:
    build: ./server
    user: "${UID}:${GID}"
    container_name: go-api
    image: stefandarius/mqtt-ss-api:latest
    env_file: .env
    environment:
      - MQTT_HOST_IP=${HOST_IP:-host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - broker
    ports:
      - 8080:8080
    volumes:
      - ./uploads:/app/uploads
    networks:
      - backend

  broker:
    user: "${UID}:${GID}"
    image: eclipse-mosquitto:latest
    container_name: broker
    hostname: broker
    ports:
      - "1883:1883"
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - backend

  postgres:
    container_name: postgres
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - backend

volumes:
  postgres-data:

networks:
  backend:
