services:
  # Go API Service
  go-api:
    build: ./server
    user: "${UID}:${GID}"
    container_name: go-api
    image: stefandarius/mqtt-ss-api:latest
    env_file: .env
    environment:
      - MQTT_HOST_IP=${HOST_IP:-host.docker.internal}
      - MQTT_TLS_PORT=8883
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - broker
    ports:
      - 8080:8080
    volumes:
      - ./uploads:/app/uploads
    secrets:
      - ca_crt
      - web_crt
      - web_key
    networks:
      - backend

  broker:
    image: eclipse-mosquitto:latest
    container_name: broker
    hostname: broker
    ports:
      - "8883:8883"
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf
    secrets:
      - ca_crt
      - server_crt
      - server_key
    networks:
      - backend

  postgres:
    container_name: postgres
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - backend

volumes:
  postgres-data:

networks:
  backend:

secrets:
  ca_crt:
    file: ./secrets/ca.crt
  server_crt:
    file: ./secrets/server.crt
  server_key:
    file: ./secrets/server.key
  web_crt:
    file: ./secrets/web.crt
  web_key:
    file: ./secrets/web.key
